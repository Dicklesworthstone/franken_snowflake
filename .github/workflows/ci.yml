name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: "0"

jobs:
  cross-platform:
    name: ${{ matrix.os }} workspace tests, gates, feature lanes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    # NOTE: only the `github`/`matrix`/`vars`/`secrets`/`inputs` contexts are
    # available in job-level `env`. The `runner` context is step-level only; a
    # job-level `${{ runner.temp }}` here made GitHub reject the whole workflow
    # before creating any job (every run from 2026-06-25 to 2026-08-27 failed
    # with "workflow file issue" and zero jobs).
    env:
      FSNOW_ARTIFACTS_DIR: ${{ github.workspace }}/.fsnow-artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show pinned toolchain
        run: |
          rustup show
          rustc --version --verbose
          cargo --version --verbose

      - name: Cache cargo registry and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-workspace

      - name: Cargo check (default features)
        run: cargo check --workspace --locked

      - name: Assert dependency admissibility
        run: python scripts/check-dependency-admissibility.py
        env:
          # Upstream prerequisite for the cache crate's optional `frankensqlite`
          # lane on Windows: fsqlite-vfs/fsqlite-mvcc gate the Unix-only `nix`
          # dependency under cfg(not(wasm32)). Until they re-gate to cfg(unix),
          # Windows runs the admissibility gate with only that lane skipped.
          FSNOW_SKIP_FSQLITE_WINDOWS_PREREQ: ${{ runner.os == 'Windows' && '1' || '0' }}

      - name: Assert LF-only golden fixtures
        run: python scripts/check-golden-lf.py

      - name: Assert installer shell UI safety
        if: runner.os != 'Windows'
        run: bash scripts/check-install-sh-ui.sh

      - name: Workspace tests (default features)
        run: cargo test --workspace --locked

      - name: Feature lane - cli live,mcp
        run: cargo test --locked -p franken-snowflake-cli --features live,mcp

      - name: Feature lane - core adapter-fixtures
        run: cargo test --locked -p franken-snowflake-core --features adapter-fixtures

      - name: Feature lane - frame frankenpandas
        run: cargo test --locked -p franken-snowflake-frame --features frankenpandas

      - name: Feature lane - export
        run: cargo test --locked -p franken-snowflake-export --features export

      - name: Feature lane - graph
        run: cargo test --locked -p franken-snowflake-graph --features graph

      - name: Feature lane - text-indexing frankensearch
        run: cargo test --locked -p franken-snowflake-text-indexing --features frankensearch

      - name: Feature lane - tui
        run: cargo test --locked -p franken-snowflake-tui --features tui

      - name: Feature lane - cache frankensqlite (Unix only, see admissibility note)
        if: runner.os != 'Windows'
        run: cargo test --locked -p franken-snowflake-cache --features frankensqlite

      - name: Live proof lane emits a typed skip without credentials
        run: cargo test --locked -p franken-snowflake-sqlapi --test live_proof -- --nocapture

  linux-lints:
    name: linux lint and single-version gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show pinned toolchain
        run: |
          rustup show
          rustc --version --verbose
          cargo --version --verbose

      - name: Cache cargo registry and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-lints

      - name: Workspace lint policy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Assert single Asupersync version
        run: scripts/check-asupersync-single-version.sh
