[package]
name = "franken-snowflake-cli"
default-run = "franken-snowflake"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The agent-ergonomic franken-snowflake CLI binary."
publish.workspace = true

# The CLI body is a library so both binaries below share one compiled unit
# (one build, one test run, no "main.rs present in multiple targets" warning).
[lib]
name = "franken_snowflake_cli"
path = "src/lib.rs"

# The installed binary is `franken-snowflake`, matching the documented contract.
[[bin]]
name = "franken-snowflake"
path = "src/main.rs"

# `fsnow` is the short agent-ergonomic alias (same entry point + identical
# contract). Agents type the connector name constantly; the 5-char form cuts
# keystrokes without changing any behavior. The long name stays canonical for
# documentation and the `invocation` strings in `capabilities`.
[[bin]]
name = "fsnow"
path = "src/bin/fsnow.rs"

[lints]
workspace = true

[features]
default = ["toon"]
mcp = ["dep:franken-snowflake-mcp", "franken-snowflake-mcp/mcp"]
# Opt-in interactive catalog browser + query planner (FrankenTUI, crossterm)
# over the local store's latest snapshot. Default-off: agents use the JSON
# surfaces, and a non-TTY invocation refuses typed instead of hanging.
tui = ["dep:franken-snowflake-tui", "franken-snowflake-tui/tui"]
toon = ["dep:toon"]
# Opt-in columnar frame materialization (FrankenPandas fp-columnar + fp-types)
# for result partitions.
frankenpandas = [
    "dep:franken-snowflake-frame",
    "franken-snowflake-frame/frankenpandas",
]
# Opt-in text indexing contracts and Frankensearch hash+lexical indexing.
frankensearch = [
    "dep:franken-snowflake-text-indexing",
    "franken-snowflake-text-indexing/frankensearch",
]
# Opt-in live SQL API transport for `query run` / `catalog scan` / `profile
# doctor --online`. Default-off so the agent CLI stays a no-account slice (no
# transport, no asupersync) until live use is explicitly requested. Runtime-gated
# in addition: even with the feature, a command refuses cleanly when a profile's
# credential env handles are absent (never substitutes fixture/empty data).
live = [
    "dep:franken-snowflake-sqlapi",
    "dep:franken-snowflake-http",
    "dep:franken-snowflake-auth",
    "dep:asupersync",
    "dep:signal-hook",
]
# Test-only: lets the live transport reach a loopback mock SQL API over real
# TLS (`<PREFIX>_ACCOUNT=https://127.0.0.1:<port>`) for the hermetic socket e2e
# (`tests/socket_e2e.rs`, reality-check bead F1). Never enabled by a release
# build; `capabilities` reports it as `feature_flags.testkit`.
testkit-endpoint = ["live", "franken-snowflake-http/testkit-endpoint"]

[build-dependencies]
# Source digest for the build identity (build.rs); already in the graph.
sha2 = "0.10"

[dependencies]
franken-snowflake-core = { path = "../franken-snowflake-core", version = "0.0.4" }
# The finished library crates the CLI surfaces are built on: catalog discovery
# + manifests + planner, the local store (receipts/audit/snapshots), the lineage
# graph renderer, and COPY INTO / local export planning. All offline-capable.
franken-snowflake-catalog = { path = "../franken-snowflake-catalog", version = "0.0.4" }
franken-snowflake-cache = { path = "../franken-snowflake-cache", version = "0.0.4" }
franken-snowflake-graph = { path = "../franken-snowflake-graph", version = "0.0.4" }
franken-snowflake-export = { path = "../franken-snowflake-export", features = ["export"], version = "0.0.4" }
franken-snowflake-frame = { path = "../franken-snowflake-frame", optional = true, version = "0.0.4" }
franken-snowflake-text-indexing = { path = "../franken-snowflake-text-indexing", optional = true, version = "0.0.4" }
franken-snowflake-mcp = { path = "../franken-snowflake-mcp", optional = true, version = "0.0.4" }
franken-snowflake-tui = { path = "../franken-snowflake-tui", optional = true, version = "0.0.4" }
franken-snowflake-sqlapi = { path = "../franken-snowflake-sqlapi", optional = true, version = "0.0.4" }
franken-snowflake-http = { path = "../franken-snowflake-http", optional = true, version = "0.0.4" }
franken-snowflake-auth = { path = "../franken-snowflake-auth", optional = true, version = "0.0.4" }
asupersync = { workspace = true, optional = true }
# SIGINT/SIGTERM handling for in-flight live statements (bead E1), through the
# safe flag API; already in the graph through asupersync.
signal-hook = { version = "0.4", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SHA-256 of the running executable for `capabilities --with-exe-hash` (bead H1);
# already in the graph through franken-snowflake-auth.
sha2 = "0.10"
# Random confirmation ids and the keyed statement digest of the write ladder
# (bead B4); both already in the graph.
getrandom = "0.3"
hmac = "0.12"
toon = { package = "tru", version = "0.2.3", default-features = false, optional = true }

[dev-dependencies]
# The socket e2e mints a throwaway CA per run (pure Rust, ring backend; ring is
# already in the graph through rustls) and replays the testkit's SQL API
# fixtures over a real TLS listener.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
franken-snowflake-testkit = { path = "../franken-snowflake-testkit" }
# A throwaway RSA key for the key-pair JWT re-sign scenario (both already in
# the graph through franken-snowflake-auth).
rsa = { version = "0.9", default-features = false, features = ["std", "pem"] }
rand = "0.8"
# Validates typed rows against docs/protocol/typed_rows.v1.schema.json. No
# default features: no HTTP/file schema resolution, so no reqwest or Tokio.
jsonschema = { version = "0.56", default-features = false }
