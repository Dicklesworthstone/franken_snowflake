[package]
name = "franken-snowflake-text-indexing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Optional hash and lexical Frankensearch text indexing contracts for franken_snowflake."
publish.workspace = true

[features]
default = []
frankensearch = ["dep:frankensearch"]

[lints]
workspace = true

[dependencies]
franken-snowflake-core = { path = "../franken-snowflake-core", version = "0.0.7" }
# `lexical-tantivy` keeps the Tantivy BM25 index format (Frankensearch 0.6+'s
# `lexical` feature is its Quill engine). 0.7.1 stays on `asupersync ^0.5.0`
# (matching the single-version `asupersync = "=0.5.0"` invariant) and `rustix =1.1.5`
# (matching `fastmcp 0.13`); 0.8.0 requires `asupersync ^0.6.2`.
frankensearch = { version = "0.7.1", default-features = false, features = ["hash", "lexical-tantivy"], optional = true }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
asupersync = { workspace = true, features = ["test-internals"] }
tempfile = "3"
