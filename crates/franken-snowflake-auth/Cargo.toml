[package]
name = "franken-snowflake-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Secret-safe Snowflake auth construction (PAT, key-pair JWT, OAuth) for franken_snowflake."
publish.workspace = true

[lints]
workspace = true

[dependencies]
asupersync = { workspace = true }
base64 = "0.23"
jsonwebtoken = { version = "12", default-features = false, features = ["rust_crypto", "use_pem"] }
rsa = { version = "0.10", default-features = false, features = ["std", "encoding", "pkcs5"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
pkcs8 = { version = "0.11", default-features = false, features = ["getrandom", "pem"] }
rand = "0.10"
tempfile = "3"
