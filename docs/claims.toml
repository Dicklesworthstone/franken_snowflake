# Claims ledger (bead oj0.4): each load-bearing README capability claim, the
# README section it sits in, a verbatim piece of it, and the evidence behind it.
# scripts/check-claims.py enforces it in the release proof; see that script for
# the field rules. A claim whose evidence is gone or stale fails the gate:
# correct the README or refresh the evidence, never the other way round.

