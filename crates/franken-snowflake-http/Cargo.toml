[package]
name = "franken-snowflake-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Asupersync-native HTTPS transport API for the franken_snowflake Snowflake SQL API connector."
publish.workspace = true

[features]
default = []
live = []
testkit = []
compression = []
# Accept a loopback `https://127.0.0.1:<port>` endpoint for the hermetic socket
# e2e (reality-check bead F1). Never enabled by a release build; production
# endpoint validation is unchanged.
testkit-endpoint = []

[lints]
workspace = true

[dependencies]
asupersync = { workspace = true }
franken-snowflake-core = { path = "../franken-snowflake-core", version = "0.0.4" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
asupersync = { workspace = true, features = ["test-internals"] }
