  "test:franken-snowflake-sqlapi::driver::tests::a_statement_whose_driver_is_leaked_is_reported_as_a_leaked_lease",
  "test:franken-snowflake-sqlapi::driver::tests::the_cli_runtime_flavor_tracks_statement_leases",
]

