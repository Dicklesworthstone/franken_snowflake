[[claim]]
id = "outcome-intact"
heading = "Design Philosophy"
text = "which reaches the CLI envelope intact (a cancellation reads `cancelled` or `timeout`, never an internal error)"
evidence = ["test:franken-snowflake-cli::live::tests::scripted_cancellations_reach_the_envelope_by_kind"]

[[claim]]
id = "remote-cancel-every-path"
heading = "Design Philosophy"
text = "Once a statement is submitted, every error path and every deadline, budget, shutdown, or user cancellation fires a best-effort remote cancel."
evidence = [
  "test:franken-snowflake-sqlapi::driver::tests::deadline_during_poll_routes_through_the_policy_cancel_with_deadline_kind",
  "test:franken-snowflake-sqlapi::driver::tests::one_failed_fetch_in_a_window_abandons_the_statement_after_the_window_settles",
  "test:franken-snowflake-cli::a_failed_partition_fetch_cancels_the_statement",
  "test:franken-snowflake-cli::sigint_cancels_the_statement_in_flight",
]

[[claim]]
id = "masked-submit"
heading = "Design Philosophy"
text = "A cancel that arrives while the submit itself is in flight waits for Snowflake's answer"
evidence = [
  "test:franken-snowflake-testkit::race::tests::default_race_suite_proves_cancel_retry_invariants",
  "test:franken-snowflake-sqlapi::driver::tests::an_already_expired_deadline_submits_nothing",
]

[[claim]]
id = "client-deadline"
heading = "Design Philosophy"
text = "a statement still running 5 s past its statement timeout is cancelled by the client"
evidence = ["test:franken-snowflake-cli::a_statement_past_its_timeout_is_cancelled_by_the_client"]

[[claim]]
id = "credit-cap"
heading = "Design Philosophy"
text = "With `MAX_CREDITS` set, a statement whose estimated credits reach the cap is cancelled the same way"
evidence = [
  "test:franken-snowflake-cli::a_credit_cap_cancels_a_statement_that_would_exceed_it",
  "test:franken-snowflake-cli::a_credit_cap_below_the_resume_minimum_submits_no_query",
]

[[claim]]
id = "signals"
heading = "Design Philosophy"
text = "Ctrl-C (SIGINT) or SIGTERM cancels it the same way: the envelope reads `cancelled` and the exit status is 130 (SIGINT) or 143 (SIGTERM)"
evidence = [
  "test:franken-snowflake-cli::sigint_cancels_the_statement_in_flight",
  "test:franken-snowflake-cli::live::tests::signal_cancelled_runs_exit_130_or_143",
]

[[claim]]
id = "drop-guard"
heading = "Design Philosophy"
text = "if the driver's future is dropped mid-flight (a library caller abandons it, a panic unwinds through it), the remote cancel is still sent"
evidence = ["test:franken-snowflake-sqlapi::driver::tests::dropping_the_driver_mid_poll_cancels_the_statement"]

[[claim]]
id = "lease-obligation"
heading = "Design Philosophy"
text = "The running statement is also an Asupersync `Lease` obligation held by the task that drives it"
evidence = [
